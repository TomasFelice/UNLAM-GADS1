        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        status:
          type: string
          enum:
          - POTENCIAL
          - CLIENTE
          - INACTIVO
          - NO_CONTACTAR
    CompanyRequest:
      type: object
