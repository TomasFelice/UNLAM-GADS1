          type: string
          description: "Opcional. Formato: 11 dígitos, con o sin guiones."
          example: 30-71234567-9
        industry:
          type: string
          example: Turismo y eventos
        email:
          type: string
          format: email
          example: contacto@eventosdelsur.com
        phone:
          type: string
          example: +54 11 4000-0000
        address:
          type: string
          example: "Av. Rivadavia 4500, San Justo"
        locality:
          type: string
          example: San Justo
        website:
          type: string
          example: https://eventosdelsur.com
        status:
          type: string
          enum:
          - POTENCIAL
          - CLIENTE
          - INACTIVO
          - NO_CONTACTAR
        salesRepId:
          type: integer
          format: int64
          description: "Id del responsable. Si se omite, el backend aplica la herencia\
            \ de DP-02"
        originId:
          type: integer
          format: int64
          description: Id del origen comercial
        notes:
          type: string
