          minLength: 1
        companyId:
          type: integer
          format: int64
          description: Empresa relacionada. Al menos una de companyId/contactId es
            obligatoria.
        contactId:
          type: integer
          format: int64
          description: Contacto relacionado. Al menos una de companyId/contactId es
            obligatoria.
        salesRepId:
          type: integer
          format: int64
          description: Usuario responsable comercial (RN-01 de la consigna)
        venueId:
          type: integer
          format: int64
        stageId:
          type: integer
          format: int64
          description: Etapa inicial — debe ser una etapa abierta (DP-06)
        eventTypeId:
          type: integer
          format: int64
        estimatedValue:
          type: number
        probability:
          type: integer
          format: int32
          maximum: 100
          minimum: 0
        eventStart:
          type: string
          format: date-time
        eventEnd:
          type: string
          format: date-time
        attendeeCount:
          type: integer
          format: int32
          exclusiveMinimum: 0
        estimatedCloseDate:
          type: string
