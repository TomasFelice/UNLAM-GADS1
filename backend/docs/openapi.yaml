          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpportunityDetailResponse"
    put:
      tags:
      - Opportunities
      summary: "Edita una oportunidad abierta (no cambia etapa, responsable ni estado)"
      operationId: update_5
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOpportunityRequest"
        required: true
      responses:
        "200":
          description: Oportunidad actualizada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpportunityResponse"
        "404":
          description: No existe una oportunidad con ese id
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpportunityResponse"
        "409":
          description: La oportunidad está cerrada o la etapa es incompatible con
            su embudo/tipo
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpportunityResponse"
