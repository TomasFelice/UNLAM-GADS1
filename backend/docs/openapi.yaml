openapi: 3.1.0
info:
  title: zTech CRM API
  description: API del CRM de salones de eventos corporativos — UNLaM GADS1.
  version: v1
servers:
- url: http://localhost:56214
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: LossReasons
  description: Administración de motivo de pérdida; lecturas comerciales por tenant
- name: EventServices
  description: Servicios adicionales (BE-OFF-03/04)
- name: EventTypes
  description: Administración de tipo de evento; lecturas comerciales por tenant
- name: Venues
  description: Salones (BE-OFF-01/02)
- name: Activities
  description: Registro append-only e historial comercial autorizado
- name: Opportunities
  description: Gestión de oportunidades (BE-OPP-01..03/05/06)
- name: Stages
  description: Etapas propias de un embudo. Sólo ADMIN configura (BE-CAT-02)
- name: Users
  description: Administración de usuarios y responsables
- name: Auth
  description: Autenticación (BE-SEC-01)
- name: PipelineTemplates
  description: Plantillas inmutables de la aplicación; cada copia usa IDs propios
- name: Contacts
  description: Gestión de contactos (BE-CUS-04..07)
- name: ActivityTypes
  description: Administración de tipo de actividad; lecturas comerciales por tenant
- name: Companies
  description: Gestión de empresas (BE-CUS-01..03)
- name: Origins
  description: Administración de origen; lecturas comerciales por tenant
- name: Pipelines
  description: Embudos configurables por tenant (ADR-006). Sólo ADMIN escribe.
paths:
  /api/v1/venues/{id}:
    get:
      tags:
      - Venues
      summary: Detalle de un salón
      operationId: getById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VenueResponse"
        "404":
          description: No existe un salón con ese id
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VenueResponse"
    put:
      tags:
      - Venues
      summary: Edita un salón o cambia su estado
      description: Sólo ADMIN; la baja es lógica y conserva referencias comerciales.
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueRequest"
        required: true
      responses:
        "200":
          description: Salón actualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VenueResponse"
        "400":
          description: Datos inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VenueResponse"
        "403":
          description: Requiere ADMIN
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VenueResponse"
        "404":
          description: No se encontró el salón en la organización
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VenueResponse"
        "409":
          description: La reducción de capacidad invalidaría una reserva confirmada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VenueResponse"
  /api/v1/users/{id}:
    get:
      tags:
      - Users
      summary: Obtiene un usuario del tenant (sólo ADMIN)
      operationId: getById_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Usuario encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "403":
          description: Rol insuficiente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          description: Usuario inexistente o de otro tenant
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
    put:
      tags:
      - Users
      summary: "Actualiza perfil, rol y estado (sólo ADMIN)"
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/stages/{id}:
    get:
      tags:
      - Stages
      summary: "Consulta una etapa, incluso inactiva"
      operationId: detail
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "400":
          description: Datos o filtros inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StageResponse"
        "401":
          description: Sesión requerida
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StageResponse"
        "403":
          description: Sólo ADMIN puede configurar
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StageResponse"
        "404":
          description: Referencia inexistente o de otro tenant
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StageResponse"
        "409":
          description: Configuración incompatible o nombre duplicado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StageResponse"
    put:
      tags:
      - Stages
      summary: Edita o desactiva una etapa conservando su embudo e historia (ADMIN)
      operationId: update_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageRequest"
        required: true
      responses:
        "400":
          description: Datos o filtros inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StageResponse"
        "401":
          description: Sesión requerida
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StageResponse"
        "403":
          description: Sólo ADMIN puede configurar
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StageResponse"
        "404":
          description: Referencia inexistente o de otro tenant
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StageResponse"
        "409":
          description: Configuración incompatible o nombre duplicado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StageResponse"
  /api/v1/pipelines/{id}:
    get:
      tags:
      - Pipelines
      summary: "Detalle de un embudo, incluso inactivo"
      operationId: detail_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "400":
          description: Datos o filtros inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PipelineResponse"
        "401":
          description: Sesión requerida
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PipelineResponse"
        "403":
          description: Sólo ADMIN puede configurar
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PipelineResponse"
        "404":
          description: Referencia inexistente o de otro tenant
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PipelineResponse"
        "409":
          description: Configuración incompatible o nombre duplicado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PipelineResponse"
    put:
      tags:
      - Pipelines
      summary: "Renombra, activa o desactiva un embudo (ADMIN)"
      operationId: update_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogEntryRequest"
        required: true
      responses:
        "400":
          description: Datos o filtros inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PipelineResponse"
        "401":
          description: Sesión requerida
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PipelineResponse"
        "403":
          description: Sólo ADMIN puede configurar
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PipelineResponse"
        "404":
          description: Referencia inexistente o de otro tenant
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PipelineResponse"
        "409":
          description: Configuración incompatible o nombre duplicado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PipelineResponse"
