              schema:
                $ref: "#/components/schemas/ContactResponse"
        "404":
          description: "Contacto o empresa fuera de alcance, o responsable/origen\
            \ ajeno a la organización"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "409":
          description: Ya existe un contacto con ese documento
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "422":
          description: El responsable o el nuevo origen no está activo; se permite
            conservar el origen inactivo anterior
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContactResponse"
  /api/v1/companies/{id}:
    get:
      tags:
      - Companies
      summary: "Detalle de una empresa, con sus contactos (BE-CUS-03)"
      description: Para SELLER exige asignación directa o una oportunidad propia;
        los contactos anidados también se filtran por ese alcance. Incluye salesRepName
        aun si el responsable está inactivo.
      operationId: getById_5
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompanyDetailResponse"
        "404":
