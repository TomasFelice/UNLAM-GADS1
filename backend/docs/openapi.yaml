components:
  schemas:
    VenueRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        capacity:
          type: integer
          format: int32
          exclusiveMinimum: 0
        rate:
          type: number
          description: Tarifa opcional en ARS.
          minimum: 0
        address:
          type: string
        locality:
          type: string
        description:
          type: string
        equipment:
          type: array
          items:
            type: string
            minLength: 1
        status:
          type: string
          enum:
          - DISPONIBLE
          - MANTENIMIENTO
          - INACTIVO
      required:
      - capacity
      - name
      - status
    VenueResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        capacity:
          type: integer
          format: int32
        rate:
          type: number
        address:
          type: string
        locality:
          type: string
        description:
          type: string
        equipment:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - DISPONIBLE
          - MANTENIMIENTO
          - INACTIVO
    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        firstName:
          type: string
