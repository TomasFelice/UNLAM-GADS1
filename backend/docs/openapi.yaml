openapi: 3.1.0
info:
  title: zTech CRM API
  description: API del CRM de salones de eventos corporativos — UNLaM GADS1.
  version: v1
servers:
- url: http://localhost:53103
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Origins
  description: Orígenes comerciales del tenant
- name: Loss reasons
  description: Motivos de pérdida del tenant
- name: EventTypes
  description: Tipos configurables de evento
- name: Venues
  description: Salones (BE-OFF-01)
- name: Stages
  description: "Etapas del embudo comercial (BE-CAT-01, DP-06)"
- name: Activity types
  description: Tipos de actividad del tenant
- name: Opportunities
  description: Gestión de oportunidades (BE-OPP-01..03/05/06)
- name: Activities
  description: Lectura tenant-aware del historial comercial
- name: Users
  description: Administración de usuarios y responsables
- name: Auth
  description: Autenticación (BE-SEC-01)
- name: EventServices
  description: Servicios adicionales (BE-OFF-03)
- name: Contacts
  description: Gestión de contactos (BE-CUS-04..07)
- name: Companies
  description: Gestión de empresas (BE-CUS-01..03)
paths:
  /api/v1/users/{id}:
    get:
      tags:
      - Users
      summary: Obtiene un usuario del tenant (sólo ADMIN)
      operationId: getById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Usuario encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "403":
          description: Rol insuficiente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          description: Usuario inexistente o de otro tenant
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
    put:
      tags:
      - Users
      summary: "Actualiza perfil, rol y estado (sólo ADMIN)"
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/opportunities/{id}:
    get:
      tags:
      - Opportunities
      summary: "Detalle de una oportunidad, con cliente, salón y etapa resueltos (BE-OPP-03)"
      operationId: getById_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpportunityDetailResponse"
        "404":
          description: No existe una oportunidad con ese id
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpportunityDetailResponse"
    put:
      tags:
      - Opportunities
      summary: "Edita una oportunidad abierta (no cambia etapa, responsable ni estado)"
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOpportunityRequest"
        required: true
      responses:
        "200":
          description: Oportunidad actualizada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpportunityResponse"
        "404":
          description: No existe una oportunidad con ese id
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpportunityResponse"
        "409":
          description: La oportunidad está cerrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpportunityResponse"
  /api/v1/contacts/{id}:
    get:
      tags:
      - Contacts
      summary: Detalle de un contacto
      description: Para SELLER exige asignación directa o una oportunidad propia relacionada.
      operationId: getById_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContactDetailResponse"
        "404":
          description: No existe un contacto con ese id
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContactDetailResponse"
    put:
      tags:
      - Contacts
      summary: Edita un contacto
      operationId: update_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
        required: true
      responses:
        "200":
          description: Contacto actualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "404":
          description: "No existe un contacto con ese id, o la empresa relacionada\
            \ no existe"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "409":
          description: Ya existe un contacto con ese documento
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContactResponse"
  /api/v1/companies/{id}:
    get:
      tags:
      - Companies
      summary: "Detalle de una empresa, con sus contactos (BE-CUS-03)"
      description: Para SELLER exige asignación directa o una oportunidad propia;
        los contactos anidados también se filtran por ese alcance.
      operationId: getById_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompanyDetailResponse"
        "404":
          description: No existe una empresa con ese id
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompanyDetailResponse"
    put:
      tags:
      - Companies
      summary: Edita una empresa
      operationId: update_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyRequest"
        required: true
      responses:
        "200":
          description: Empresa actualizada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "404":
          description: No existe una empresa con ese id
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "409":
          description: Ya existe una empresa con ese CUIT
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompanyResponse"
  /api/v1/users:
    get:
      tags:
      - Users
      summary: Lista usuarios del tenant (sólo ADMIN)
      operationId: list
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: role
        in: query
        required: false
        schema:
          type: string
          enum:
          - ADMIN
          - SELLER
          - SALES_MANAGER
      - name: active
        in: query
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: "lastName,asc"
      responses:
        "200":
          description: Listado paginado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseUserResponse"
        "403":
          description: Rol insuficiente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseUserResponse"
    post:
      tags:
      - Users
      summary: Crea un usuario con contraseña temporal (sólo ADMIN)
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/users/{id}/reset-password:
    post:
      tags:
      - Users
      summary: Restablece la contraseña temporal e invalida sesiones (sólo ADMIN)
      operationId: resetPassword
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "200":
          description: OK
  /api/v1/opportunities:
    get:
      tags:
      - Opportunities
      summary: "Lista oportunidades visibles, paginado"
      description: SELLER ve sólo sus oportunidades; ADMIN y SALES_MANAGER ven todas
        las del tenant.
      operationId: list_1
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ABIERTA
          - GANADA
          - PERDIDA
      - name: stageId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: originId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: salesRepId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: venueId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: companyId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: contactId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: eventFrom
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: eventTo
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: "eventStart,desc"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseOpportunityResponse"
    post:
      tags:
      - Opportunities
      summary: Crea una oportunidad
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOpportunityRequest"
        required: true
      responses:
        "201":
          description: Oportunidad creada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpportunityResponse"
        "400":
          description: Datos inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpportunityResponse"
        "404":
          description: "La empresa, el contacto, el salón o la etapa relacionados\
            \ no existen"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpportunityResponse"
        "422":
          description: "Falta empresa/contacto, o la etapa inicial no está abierta"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpportunityResponse"
  /api/v1/opportunities/{id}/stage:
    post:
      tags:
      - Opportunities
      summary: Cambia la etapa de una oportunidad abierta y registra el historial
        (BE-OPP-05)
      operationId: changeStage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeStageRequest"
        required: true
      responses:
        "200":
          description: Etapa cambiada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpportunityResponse"
        "404":
          description: No existe la oportunidad o la etapa destino
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpportunityResponse"
        "409":
          description: La oportunidad está cerrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpportunityResponse"
        "422":
          description: "Misma etapa, o etapa destino no abierta (usar /win o /lose)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpportunityResponse"
  /api/v1/contacts:
    get:
      tags:
      - Contacts
      summary: "Lista contactos visibles, paginado"
      description: ADMIN y SALES_MANAGER ven el tenant completo. SELLER ve asignaciones
        directas y contactos relacionados con oportunidades propias.
      operationId: list_2
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - POTENCIAL
          - CLIENTE
          - INACTIVO
          - NO_CONTACTAR
      - name: originId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: salesRepId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: companyId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: "lastName,asc"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseContactResponse"
    post:
      tags:
      - Contacts
      summary: Crea un contacto
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
        required: true
      responses:
        "201":
          description: Contacto creado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "400":
          description: Datos inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "404":
          description: La empresa relacionada no existe
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "409":
          description: Ya existe un contacto con ese documento
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContactResponse"
  /api/v1/companies:
    get:
      tags:
      - Companies
      summary: "Lista empresas visibles, paginado"
      description: ADMIN y SALES_MANAGER ven el tenant completo. SELLER ve asignaciones
        directas y empresas relacionadas con oportunidades propias.
      operationId: list_3
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - POTENCIAL
          - CLIENTE
          - INACTIVO
          - NO_CONTACTAR
      - name: originId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: salesRepId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: "businessName,asc"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseCompanyResponse"
    post:
      tags:
      - Companies
      summary: Crea una empresa
      operationId: create_3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyRequest"
        required: true
      responses:
        "201":
          description: Empresa creada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "400":
          description: Datos inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "409":
          description: Ya existe una empresa con ese CUIT
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompanyResponse"
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Inicia sesión y devuelve un JWT
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Login exitoso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Datos de la solicitud inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Credenciales inválidas
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
      security: []
  /api/v1/auth/change-password:
    post:
      tags:
      - Auth
      summary: Cambia la contraseña del usuario autenticado e invalida sus sesiones
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "204":
          description: Contraseña actualizada
        "422":
          description: La contraseña actual es incorrecta o no cambió
  /api/v1/venues:
    get:
      tags:
      - Venues
      summary: Lista los salones del tenant
      operationId: list_4
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VenueResponse"
  /api/v1/venues/{id}:
    get:
      tags:
      - Venues
      summary: Detalle de un salón
      operationId: getById_4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VenueResponse"
        "404":
          description: No existe un salón con ese id
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VenueResponse"
  /api/v1/users/assignable:
    get:
      tags:
      - Users
      summary: Lista responsables disponibles según el rol actual
      operationId: assignable
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
  /api/v1/stages:
    get:
      tags:
      - Stages
      summary: "Lista las etapas del tenant, ordenadas por posición"
      operationId: list_5
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StageResponse"
  /api/v1/origins:
    get:
      tags:
      - Origins
      summary: Lista orígenes comerciales
      operationId: list_6
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OriginResponse"
  /api/v1/opportunities/{id}/stage-history:
    get:
      tags:
      - Opportunities
      summary: Lista el historial append-only de etapas en orden cronológico
      operationId: stageHistory
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StageHistoryResponse"
  /api/v1/opportunities/{id}/activities:
    get:
      tags:
      - Activities
      summary: Lista actividades de una oportunidad visible
      operationId: byOpportunity
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: "occurredAt,desc"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseActivityResponse"
  /api/v1/opportunities/board:
    get:
      tags:
      - Opportunities
      summary: "Oportunidades visibles agrupadas por etapa, una columna por etapa\
        \ (BE-OPP-06)"
      description: SELLER ve sólo sus oportunidades; ADMIN y SALES_MANAGER ven todas
        las del tenant.
      operationId: board
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ABIERTA
          - GANADA
          - PERDIDA
      - name: stageId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: originId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: salesRepId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: venueId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: companyId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: contactId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: eventFrom
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: eventTo
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpportunityBoardResponse"
  /api/v1/loss-reasons:
    get:
      tags:
      - Loss reasons
      summary: Lista motivos de pérdida
      operationId: list_7
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LossReasonResponse"
  /api/v1/event-types:
    get:
      tags:
      - EventTypes
