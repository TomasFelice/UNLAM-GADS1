  /api/v1/contacts/{id}:
    get:
      tags:
      - Contacts
      summary: Detalle de un contacto
      description: Para SELLER exige asignación directa o una oportunidad propia relacionada.
        Incluye salesRepName aun si el responsable está inactivo.
      operationId: getById_4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContactDetailResponse"
        "404":
          description: No existe un contacto con ese id
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContactDetailResponse"
    put:
      tags:
      - Contacts
      summary: Edita un contacto
      operationId: update_9
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
