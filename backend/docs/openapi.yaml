      - Companies
      summary: Edita una empresa
      operationId: update_10
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyRequest"
        required: true
      responses:
        "200":
          description: Empresa actualizada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "404":
          description: "Empresa fuera de alcance, o responsable/origen ajeno a la\
            \ organización"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "409":
          description: Ya existe una empresa con ese CUIT
          content:
            '*/*':
              schema:
