              schema:
                $ref: "#/components/schemas/OriginResponse"
  /api/v1/opportunities/{id}:
    get:
      tags:
      - Opportunities
      summary: "Detalle de una oportunidad, con cliente, salón y etapa resueltos (BE-OPP-03)"
