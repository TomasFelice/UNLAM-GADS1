  /api/v1/venues:
    get:
      tags:
      - Venues
      summary: "Lista salones del tenant con búsqueda, estado y paginación"
      operationId: list
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - DISPONIBLE
          - MANTENIMIENTO
          - INACTIVO
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
