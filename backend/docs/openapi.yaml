components:
  schemas:
    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        role:
          type: string
          enum:
          - ADMIN
          - SELLER
          - SALES_MANAGER
        active:
          type: boolean
      required:
      - email
      - firstName
      - lastName
      - role
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - SELLER
          - SALES_MANAGER
        active:
          type: boolean
        mustChangePassword:
          type: boolean
    UpdateOpportunityRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        companyId:
          type: integer
          format: int64
        contactId:
          type: integer
          format: int64
        venueId:
          type: integer
          format: int64
        eventTypeId:
          type: integer
          format: int64
        estimatedValue:
          type: number
        probability:
          type: integer
          format: int32
          maximum: 100
          minimum: 0
        eventStart:
          type: string
          format: date-time
        eventEnd:
          type: string
          format: date-time
        attendeeCount:
          type: integer
          format: int32
          exclusiveMinimum: 0
        estimatedCloseDate:
          type: string
          format: date
        originId:
          type: integer
          format: int64
        serviceIds:
          type: array
          items:
            type: integer
            format: int64
          uniqueItems: true
        notes:
          type: string
      required:
      - attendeeCount
      - eventEnd
      - eventStart
      - eventTypeId
      - title
      - venueId
    OpportunityResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        companyId:
          type: integer
          format: int64
        contactId:
          type: integer
          format: int64
        salesRepId:
          type: integer
          format: int64
        venueId:
          type: integer
          format: int64
        stageId:
          type: integer
          format: int64
        eventTypeId:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - ABIERTA
          - GANADA
          - PERDIDA
        estimatedValue:
          type: number
        eventStart:
          type: string
          format: date-time
        eventEnd:
          type: string
          format: date-time
        attendeeCount:
          type: integer
          format: int32
        serviceIds:
          type: array
          items:
            type: integer
            format: int64
          uniqueItems: true
        companyName:
          type: string
        contactName:
          type: string
        salesRepName:
          type: string
        venueName:
          type: string
        stageName:
          type: string
    ContactRequest:
      type: object
      properties:
        companyId:
          type: integer
          format: int64
          description: Id de la empresa relacionada. Vacío si es cliente individual
            (Módulo 1 de la consigna).
        firstName:
          type: string
          example: María
          minLength: 1
        lastName:
          type: string
          example: Gómez
          minLength: 1
        document:
          type: string
          description: Opcional
          example: "30123456"
        position:
          type: string
          description: "Cargo, si corresponde"
          example: Responsable de compras
        email:
          type: string
          format: email
          example: maria.gomez@empresa.com
        phone:
          type: string
          example: +54 11 4000-0000
        status:
          type: string
          enum:
          - POTENCIAL
          - CLIENTE
          - INACTIVO
          - NO_CONTACTAR
        salesRepId:
          type: integer
          format: int64
          description: "Id del usuario responsable comercial, si ya está asignado"
        originId:
          type: integer
          format: int64
          description: Id del origen comercial
        notes:
          type: string
      required:
      - firstName
      - lastName
      - status
    ContactResponse:
      type: object
      properties:
        id:
